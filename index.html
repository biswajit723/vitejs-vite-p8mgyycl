<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123a5d" />
  <meta name="application-name" content="Reports Generate Tools" />
  <meta name="msapplication-TileColor" content="#123a5d" />
  <meta name="msapplication-TileImage" content="/app-logo-192.png?v=3" />
  <link rel="manifest" href="/manifest.webmanifest?v=3" />
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="192x192" href="/app-logo-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="/app-logo-512.png?v=3" />
  <link rel="apple-touch-icon" sizes="192x192" href="/app-logo-192.png?v=3" />
  <title>Reports Generate Tools</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter((registration) => !registration.active?.scriptURL.endsWith('/service-worker.js')).map((registration) => registration.unregister()));
        navigator.serviceWorker.register('/service-worker.js?v=3', { updateViaCache: 'none' });
      });
    }
  </script>
</body>
</html>
